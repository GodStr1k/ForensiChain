version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: forensichain_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forensichain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forensichain123}
      POSTGRES_DB: ${POSTGRES_DB:-forensichain}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
